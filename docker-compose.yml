# Orquestación de la web GymSheet. El backend NestJS vive en otro repo; aquí se
# asume accesible (por host.docker.internal en local o por otra red en despliegue).
services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: gymsheet-web:latest
    container_name: gymsheet-web
    ports:
      - '3001:3001'
    environment:
      NODE_ENV: production
      PORT: '3001'
      HOSTNAME: 0.0.0.0
      # Autoridad de autorización (backend). Ajusta según tu despliegue.
      BACKEND_API_URL: ${BACKEND_API_URL:-http://host.docker.internal:3000/api/v1}
      APP_URL: ${APP_URL:-http://localhost:3001}
      BACKEND_REQUEST_TIMEOUT_MS: ${BACKEND_REQUEST_TIMEOUT_MS:-15000}
    extra_hosts:
      # Permite alcanzar un backend que corre en el host anfitrión.
      - 'host.docker.internal:host-gateway'
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'wget', '--quiet', '--tries=1', '--spider', 'http://localhost:3001/api/health']
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
