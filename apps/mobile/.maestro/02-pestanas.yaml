# Las cinco pestañas. Verifica que cada sección carga sus datos reales del
# backend, no sólo que la barra cambia de icono.
#
# Cada espera apunta a un texto propio de la pantalla (su subtítulo o una
# sección) y no a la etiqueta de la pestaña: esa etiqueta ya está en la barra
# antes de tocar nada, así que esperarla no probaría que la sección cargó.
appId: app.gymsheet.mobile
name: 02 · Navegación — las cinco pestañas
---
- runFlow: login.subflow.yaml
# Los ítems de la barra se llaman «Rutinas, tab, 2 of 5» en el árbol de
# accesibilidad de iOS, no «Rutinas»: Maestro compara el texto como expresión
# regular completa, así que el nombre a secas no encuentra nada.
#
# El «de N» es la comprobación de la corrección de accesibilidad: antes decía
# «de 9», contando cuatro pantallas que estaban ocultas de la barra con
# `href: null` pero seguían siendo miembros del navegador.
#
# Llegó a decir «de 6» durante un tiempo: Comunidad entró en la barra sin que
# nadie actualizara esta aserción, así que el propio test escrito para cazar una
# regresión del recuento llevaba tiempo fallando por el cambio legítimo que
# debía acompañar. Vuelven a ser cinco porque Entrenos bajó al stack — con seis,
# «Comunidad» no cabía y se truncaba en la barra. Si este número no cuadra,
# compruébese primero cuántos `Tabs.Screen` hay en `(tabs)/_layout.tsx`.
- assertVisible: 'Inicio, tab, 1 of 5'
- tapOn: 'Rutinas, tab.*'
# Cada pestaña estrena su tour la primera vez que se abre.
- runFlow: cerrar-tour.subflow.yaml
- extendedWaitUntil:
    visible: 'Tus planes de entrenamiento.'
    timeout: 60000
- takeScreenshot: 05-rutinas
- tapOn: 'Ejercicios, tab.*'
# Cada pestaña estrena su tour la primera vez que se abre.
- runFlow: cerrar-tour.subflow.yaml
- extendedWaitUntil:
    visible: 'Ejercicios'
    timeout: 60000
- takeScreenshot: 06-ejercicios
# Entrenos ya no es pestaña: se alcanza desde Perfil, que es donde vive el
# historial propio. Se comprueba más abajo, después de abrir Perfil.
# Comunidad es la sexta pestaña y no estaba cubierta: se añadió a la barra
# después de escribirse este flujo, así que la evidencia enseñaba cinco de seis.
- tapOn: 'Comunidad, tab.*'
- runFlow: cerrar-tour.subflow.yaml
- extendedWaitUntil:
    visible: 'Socios de tu gimnasio, filtrados por lo que buscas.'
    timeout: 60000
- takeScreenshot: 07b-comunidad
- tapOn: 'Perfil, tab.*'
# Cada pestaña estrena su tour la primera vez que se abre.
- runFlow: cerrar-tour.subflow.yaml
- extendedWaitUntil:
    visible: 'Editar mis datos'
    timeout: 60000
- takeScreenshot: 08-perfil
# Entrenos, ya como pantalla empujada desde Perfil.
- tapOn: 'Mis entrenos.*'
- extendedWaitUntil:
    visible: 'Entrenos'
    timeout: 60000
- takeScreenshot: 07-entrenos
- tapOn: 'Volver'
- waitForAnimationToEnd:
    timeout: 4000
- tapOn: 'Inicio, tab.*'
# Cada pestaña estrena su tour la primera vez que se abre.
- runFlow: cerrar-tour.subflow.yaml
- extendedWaitUntil:
    visible: 'Tu entrenamiento de un vistazo.'
    timeout: 60000
- takeScreenshot: 09-inicio-vuelta
