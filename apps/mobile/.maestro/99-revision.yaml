appId: app.gymsheet.mobile
name: 99 · Revisión — pantallas rediseñadas
---
# Recorrido de comprobación de los cambios de diseño, no evidencia publicada:
# entra, deja pasar el tour de cada pantalla y captura las que se tocaron.
- launchApp:
    clearState: true
    clearKeychain: true
- extendedWaitUntil:
    visible: 'Inicia sesión para continuar'
    timeout: 420000
- tapOn:
    below: 'Correo electrónico'
    index: 0
- inputText: 'athlete.mock@gymsheet.local'
- pressKey: Enter
- tapOn:
    below: 'Contraseña'
    index: 0
- inputText: 'MockLocal2026!'
- pressKey: Enter
- tapOn: 'Iniciar sesión'
- tapOn:
    text: 'Ahora no'
    optional: true

# Bienvenida
- extendedWaitUntil:
    visible: 'Bienvenido a GymSheet'
    timeout: 90000
- takeScreenshot: r01-bienvenida
- tapOn: 'Saltar tutorial'

# Inicio: el tour de pantalla salta solo sobre el panel de evolución.
- extendedWaitUntil:
    visible: 'Tu evolución'
    timeout: 60000
- extendedWaitUntil:
    notVisible: 'Refreshing'
    timeout: 30000
- takeScreenshot: r02-tour-inicio
- tapOn:
    text: 'Siguiente'
    optional: true
- takeScreenshot: r03-tour-musculos
- tapOn:
    text: 'Entendido'
    optional: true
- extendedWaitUntil:
    notVisible: 'Entendido'
    timeout: 30000
- takeScreenshot: r04-inicio

# Perfil y sus pantallas apiladas
- tapOn:
    point: '90%,94%'
# Al llegar a Perfil se abre su propio tour, que es un Modal: hasta cerrarlo la
# pantalla de debajo no existe en la jerarquía consultable.
- extendedWaitUntil:
    visible: 'Tus datos'
    timeout: 60000
- takeScreenshot: r05-tour-perfil
- tapOn: 'Entendido'
- extendedWaitUntil:
    visible: 'Datos físicos'
    timeout: 60000
- takeScreenshot: r06-perfil
- scroll
- scroll
- scroll
- tapOn: 'Mi suscripción'
- extendedWaitUntil:
    visible: 'Renovar'
    timeout: 60000
- takeScreenshot: r07-membresia
- tapOn:
    text: 'Continuar'
    optional: true
- takeScreenshot: r08-renovar-fechas
- tapOn: 'Volver'
- scroll
- scroll
- scroll
- tapOn: 'Ajustes'
- extendedWaitUntil:
    visible: 'Cerrar sesión'
    timeout: 60000
- takeScreenshot: r09-ajustes
