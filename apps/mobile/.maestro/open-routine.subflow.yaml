# Abre el detalle por ID; conserva la interfaz usada por los flujos antiguos.
# Variables: EMAIL, TAB (Públicas|REPP|Mías), NAME (nombre exacto de la rutina).
appId: app.gymsheet.mobile
---
- runFlow:
    file: open-routine-by-id.subflow.yaml
    env: { EMAIL: '${EMAIL}', ROUTINE_NAME: '${NAME}', SCOPE: '${TAB}' }
