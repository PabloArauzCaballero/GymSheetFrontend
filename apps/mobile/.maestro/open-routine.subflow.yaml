# Abre el detalle de una rutina buscándola por nombre en una pestaña del catálogo.
# Variables: TAB (Públicas|REPP|Mías), NAME (texto a buscar y nombre exacto de la tarjeta).
appId: app.gymsheet.mobile
---
# Sale de donde esté (resumen, detalle de una corrida anterior…) y vuelve a la lista de Rutinas.
- openLink: gymsheet:///routines
- tapOn:
    text: 'Rutinas, tab.*'
    optional: true
- runFlow: cerrar-tour.subflow.yaml
# La lista conserva su posición de la visita anterior: se sube al principio.
- repeat:
    times: 3
    commands:
      - swipe:
          direction: DOWN
          duration: 200
- extendedWaitUntil:
    visible: 'Crear rutina'
    timeout: 60000
- tapOn: 'Pestaña ${TAB}'
- tapOn:
    id: 'routine-search'
    point: 85%,50%
- eraseText: 60
- inputText: ${NAME}
- pressKey: Enter
- extendedWaitUntil:
    visible: '${NAME}\. .*'
    timeout: 30000
# Con un programa activo el catálogo queda más abajo: se desplaza hasta centrar la tarjeta para
# que el toque no caiga sobre la barra de pestañas.
- scrollUntilVisible:
    element: '${NAME}\. .*'
    centerElement: true
    timeout: 30000
- tapOn: '${NAME}\. .*'
# El primer arranque tras un rato de silencio puede agotar la espera del cliente
# («Sin conexión»): se pulsa el propio «Reintentar» de la app, como haría una persona.
- tapOn:
    text: 'Reintentar'
    optional: true
- extendedWaitUntil:
    visible: 'Empezar rutina'
    timeout: 30000
# El calendario carga después de la cabecera: se espera a que acabe para que el
# contenido no se desplace mientras el flujo desplaza la pantalla.
- extendedWaitUntil:
    visible: 'Semana 1 de .*|Rutina de un día.*'
    timeout: 30000
