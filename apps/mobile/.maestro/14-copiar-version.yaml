# Copiar con atribución y versión nueva (plan Rutinas REPP · F4): RF-10.
# Cuenta B (expiring.mock). Requiere los seeds `seed-rutinas-evidencia.mjs` y
# `seed-rutinas-f4-version.mjs` (copia de B + versión nueva de A).
appId: app.gymsheet.mobile
name: 14 · Copiar con atribución y versión nueva
env:
  EMAIL: expiring.mock@gymsheet.local
  FIRST: Expiring
---
- runFlow: login-as.subflow.yaml
# RF-10 · p01: B guarda la pública de A en sus rutinas. Desde C2/C4 el botón
# primario de una rutina ajena es «Guardar en mis rutinas» (antes «Copiar a
# Mías», con un aviso efímero): ahora navega directamente a la copia, que se
# llama «<nombre> · vN» y ya es propia, así que ofrece «Activar programa».
- runFlow:
    file: open-routine.subflow.yaml
    env: { TAB: 'Públicas', NAME: 'Pierna para publicar' }
- tapOn: 'Guardar en mis rutinas'
- extendedWaitUntil:
    visible: 'Pierna para publicar · v.*'
    timeout: 30000
- assertVisible: 'Activar programa'
- takeScreenshot: RF-10_p01_guardada-en-mis-rutinas_ios_oscuro
# RF-10 · p02: la copia muestra «Basada en … de …». Se comprueba aquí mismo: la
# tarjeta de la copia se llama «… · vN», así que buscarla en Mías por el nombre
# de la original ya no la encuentra.
- extendedWaitUntil:
    visible: 'Basada en.*'
    timeout: 20000
- takeScreenshot: RF-10_p02_franja-basada-en_ios_oscuro
- tapOn: 'Rutinas, tab.*'

# RF-10 · p04: hay versión nueva en la copia preparada de «Pierna 3 días».
- runFlow:
    file: open-routine.subflow.yaml
    env: { TAB: 'Mías', NAME: 'Pierna 3 días' }
- extendedWaitUntil:
    visible: 'Hay una versión nueva de la original'
    timeout: 20000
- takeScreenshot: RF-10_p04_hay-version-nueva_ios_oscuro
# RF-10 · p05: ver cambios y aplicar.
- tapOn: 'Ver cambios'
- extendedWaitUntil:
    visible: 'Cambios de la versión nueva'
    timeout: 20000
- extendedWaitUntil:
    visible: '.*se añade barbell bent over row.*'
    timeout: 20000
- takeScreenshot: RF-10_p05_ver-cambios_ios_oscuro
- tapOn: 'Aplicar cambios'
- extendedWaitUntil:
    notVisible: 'Hay una versión nueva de la original'
    timeout: 30000
- takeScreenshot: RF-10_p05b_copia-actualizada_ios_oscuro
- tapOn: 'Rutinas, tab.*'

# RF-10 · p06: una rutina hecha desde cero no lleva franja de atribución.
- runFlow:
    file: open-routine.subflow.yaml
    env: { TAB: 'Mías', NAME: 'Torso de Leo' }
- assertNotVisible: 'Basada en.*'
- takeScreenshot: RF-10_p06_sin-franja_ios_oscuro
